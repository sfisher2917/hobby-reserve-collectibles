name: Test eBay Sandbox connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read Sandbox inventory without publishing
        env:
          EBAY_SANDBOX_ACCESS_TOKEN: ${{ secrets.EBAY_SANDBOX_ACCESS_TOKEN }}
          EBAY_SANDBOX_SELLER_ID: ${{ vars.EBAY_SANDBOX_SELLER_ID }}
        run: python3 scripts/test_ebay_sandbox.py
